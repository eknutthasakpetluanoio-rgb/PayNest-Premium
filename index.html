<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#08090b">
  <meta name="description" content="PayNest — ระบบจัดการสัญญาผ่อนชำระ">

  <title>PayNest</title>

  <link rel="stylesheet" href="css/style.css?v=1">
</head>

<body>

  <div id="app">

    <header class="topbar">
      <div>
        <span class="eyebrow">INSTALLMENT MANAGER</span>
        <h1>PayNest</h1>
        <p>ระบบจัดการสัญญาผ่อนชำระ</p>
      </div>
    </header>

    <main>

      <section class="hero">
        <span>ยอดค่างวดต่อรอบ</span>
        <strong id="totalInstallment">฿0</strong>
        <small id="contractCount">0 สัญญา</small>
      </section>

      <section class="stats">

        <div class="stat-card">
          <span>ยอดคงเหลือ</span>
          <strong id="totalBalance">฿0</strong>
        </div>

        <div class="stat-card">
          <span>ชำระแล้ว</span>
          <strong id="totalPaid">฿0</strong>
        </div>

      </section>

      <section class="section">

        <div class="section-title">
          <span class="eyebrow">CONTRACTS</span>
          <h2>สัญญาล่าสุด</h2>
        </div>

        <div id="contractList">
          <div class="empty">
            <strong>ยังไม่มีสัญญา</strong>
            <span>กดปุ่ม + เพื่อเพิ่มสัญญาแรก</span>
          </div>
        </div>

      </section>

    </main>

  </div>

  <button id="addButton" class="fab" type="button">
    +
  </button>

  <nav class="bottom-nav">

    <button type="button" class="nav active">
      <span>⌂</span>
      <small>หน้าหลัก</small>
    </button>

    <button type="button" class="nav">
      <span>▤</span>
      <small>สัญญา</small>
    </button>

    <button type="button" class="nav">
      <span>□</span>
      <small>ปฏิทิน</small>
    </button>

    <button type="button" class="nav">
      <span>○</span>
      <small>ลูกค้า</small>
    </button>

    <button type="button" class="nav">
      <span>⚙</span>
      <small>ตั้งค่า</small>
    </button>

  </nav>

  <script src="js/app.js"></script>

</body>
</html>
